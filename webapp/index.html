<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Hujjatchi AI — CV va Obyektivka yaratish. Ovoz orqali avtomatik to'ldirish.">
  <meta name="theme-color" content="#1d6fe8">
  <title>Hujjatchi AI</title>
  <link rel="preload" href="theme.css" as="style">
  <link rel="stylesheet" href="theme.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <style>
    .home-hero{padding:24px 18px 8px;text-align:center}
    .home-hero h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
    .home-hero p{margin:0;font-size:14px;color:var(--text-muted)}
    .service-grid{display:grid;gap:12px;padding:16px}
    .service-card{
      display:flex;align-items:center;gap:14px;padding:16px 18px;
      border-radius:16px;border:1px solid var(--border-color);
      background:var(--card-color);text-decoration:none;color:inherit;
      box-shadow:var(--da-shadow-sm);transition:transform .15s ease,box-shadow .15s ease;
    }
    .service-card:active{transform:scale(.98)}
    .service-icon{font-size:28px;line-height:1}
    .service-meta{flex:1;min-width:0}
    .service-meta strong{display:block;font-size:16px;margin-bottom:2px}
    .service-meta span{font-size:12px;color:var(--text-muted);font-weight:600}
    .service-arrow{color:var(--da-primary);font-weight:800}
    .home-badge{
      display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
      border-radius:999px;font-size:11px;font-weight:700;
      background:var(--da-blue-soft);color:var(--da-primary);margin-bottom:12px;
    }
  </style>
</head>
<body class="da-mobile-shell">
  <main class="app-container">
    <div class="home-hero">
      <div class="home-badge">🎙 AI Voice Fill</div>
      <h1 id="welcomeTitle">Salom 👋</h1>
      <p>Kerakli xizmatni tanlang — 1 bosish, maksimal natija.</p>
    </div>
    <div class="service-grid" role="navigation" aria-label="Xizmatlar">
      <a class="service-card" href="cv.html" id="linkCv">
        <span class="service-icon" aria-hidden="true">📄</span>
        <div class="service-meta">
          <strong>CV Resume</strong>
          <span>PDF · Ovoz yoki forma</span>
        </div>
        <span class="service-arrow">→</span>
      </a>
      <a class="service-card" href="obyektivka.html?voice=1" id="linkOby">
        <span class="service-icon" aria-hidden="true">✍️</span>
        <div class="service-meta">
          <strong>Obyektivka</strong>
          <span>Word · Ovoz asosiy flow</span>
        </div>
        <span class="service-arrow">→</span>
      </a>
    </div>
  </main>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      var titleEl = document.getElementById('welcomeTitle');
      try { tg && tg.ready && tg.ready(); tg && tg.expand && tg.expand(); } catch (_) {}

      var theme = (tg && tg.colorScheme) || 'light';
      document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');

      var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
      var name = u && (u.first_name || u.username) ? (u.first_name || u.username) : 'Foydalanuvchi';
      if (titleEl) titleEl.textContent = 'Salom, ' + name + ' 👋';

      var tid = u && u.id ? String(u.id) : '';
      if (tid) {
        try { sessionStorage.setItem('tg_id', tid); } catch (_) {}
        var q = '?telegram_id=' + encodeURIComponent(tid);
        var cv = document.getElementById('linkCv');
        var oby = document.getElementById('linkOby');
        if (cv) cv.href = 'cv.html' + q;
        if (oby) oby.href = 'obyektivka.html' + q + '&voice=1&autoload=1';
      }
    })();
  </script>
</body>
</html>
