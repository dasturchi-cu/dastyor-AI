<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dastyor AI — CV PDF va Obyektivka DOCX yaratish xizmati.">
  <meta name="theme-color" content="#2563eb">
  <title>Dastyor AI</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="preload" href="app.js" as="script">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="app.js" defer></script>
  <style>
    body.home-page {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .home-shell {
      box-sizing: border-box;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100dvh;
      padding:
        calc(12px + env(safe-area-inset-top, 0px))
        16px
        calc(16px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
    }

    .home-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 40px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .home-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .home-credits {
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      color: var(--da-primary);
      background: var(--da-blue-soft);
      border: 1px solid var(--da-blue-mid);
      padding: 7px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .home-credits[hidden] { display: none !important; }

    .home-credits--loading {
      color: transparent;
      background: linear-gradient(90deg, var(--da-blue-soft) 25%, #e8f0fe 50%, var(--da-blue-soft) 75%);
      background-size: 200% 100%;
      animation: homeCreditsShimmer 1s ease-in-out infinite;
      min-width: 72px;
    }

    @keyframes homeCreditsShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Yuqori — qisqa intro */
    .home-intro {
      flex-shrink: 0;
      margin-bottom: 16px;
    }

    .home-intro h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .home-intro p {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    /* O'rta — xizmatlar */
    .service-grid {
      display: grid;
      gap: 10px;
      flex: 1 1 auto;
      align-content: start;
      min-height: 0;
      margin-bottom: 16px;
    }

    .service-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--card-color);
      text-decoration: none;
      color: inherit;
      box-sizing: border-box;
    }

    .service-card:active {
      background: var(--da-bg-elevated);
    }

    .service-icon {
      width: 28px;
      font-size: 22px;
      line-height: 1;
      text-align: center;
      flex-shrink: 0;
    }

    .service-meta {
      flex: 1;
      min-width: 0;
    }

    .service-meta strong {
      display: block;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 2px;
    }

    .service-meta span {
      display: block;
      font-size: 12px;
      line-height: 1.35;
      color: var(--text-muted);
    }

    .service-arrow {
      width: 24px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      color: var(--da-primary);
      flex-shrink: 0;
    }

    /* Past — qadamlar va narx */
    .home-bottom {
      flex-shrink: 0;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .home-guide {
      padding: 16px;
      border-radius: 14px;
      background: var(--card-color);
      border: 1px solid var(--border-color);
      box-sizing: border-box;
    }

    .home-guide-title {
      margin: 0 0 14px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.2;
      color: var(--text-color);
      letter-spacing: -0.01em;
    }

    .home-steps {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .home-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      position: relative;
    }

    .home-step:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 11px;
      top: 34px;
      bottom: -2px;
      width: 2px;
      background: linear-gradient(180deg, var(--da-blue-mid) 0%, transparent 100%);
      border-radius: 1px;
    }

    .home-step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--da-primary);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      line-height: 24px;
      text-align: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    .home-step-body {
      flex: 1;
      min-width: 0;
      padding-top: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .home-step-label {
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      color: var(--text-color);
    }

    .home-step-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      line-height: 1;
      white-space: nowrap;
    }

    .home-step-badge--free {
      color: #166534;
      background: #ecfdf5;
      border: 1px solid #86efac;
    }

    .home-step-badge--paid {
      color: #1d4ed8;
      background: var(--da-blue-soft);
      border: 1px solid var(--da-blue-mid);
    }

    html[data-theme="dark"] .home-step-badge--free {
      color: #86efac;
      background: rgba(22, 101, 52, 0.2);
      border-color: rgba(134, 239, 172, 0.35);
    }

    html[data-theme="dark"] .home-step-badge--paid {
      color: #93c5fd;
    }

    .home-price {
      margin: 14px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.3;
      color: #1d4ed8;
      background: linear-gradient(135deg, var(--da-blue-soft) 0%, #eff6ff 100%);
      border: 1px solid var(--da-blue-mid);
      text-align: center;
    }

    .home-price-icon {
      font-size: 18px;
      line-height: 1;
    }

    html[data-theme="dark"] .home-price {
      color: #93c5fd;
    }

    .home-cta-nocredit {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    html[data-theme="dark"] .home-cta-nocredit {
      color: #fca5a5;
      background: rgba(127, 29, 29, 0.35);
      border-color: rgba(248, 113, 113, 0.35);
    }

    .home-cta-nocredit[hidden] { display: none !important; }

    .home-footer {
      text-align: center;
      font-size: 12px;
      line-height: 1.2;
      color: var(--text-muted);
      padding-top: 4px;
    }
  </style>
</head>
<body class="home-page" data-disable-mobile-nav="true">
  <div class="home-shell">
    <header class="home-top">
      <p class="home-title">Dastyor AI</p>
      <span class="home-credits home-credits--loading" id="homeCredits">💳</span>
    </header>

    <section class="home-intro">
      <h1 id="welcomeTitle">Salom 👋</h1>
    </section>

    <nav class="service-grid" aria-label="Xizmatlar">
      <a class="service-card" href="cv.html" id="linkCv">
        <span class="service-icon" aria-hidden="true">📄</span>
        <div class="service-meta">
          <strong>CV Resume</strong>
        </div>
        <span class="service-arrow" aria-hidden="true">→</span>
      </a>
      <a class="service-card" href="obyektivka.html?voice=1" id="linkOby">
        <span class="service-icon" aria-hidden="true">📋</span>
        <div class="service-meta">
          <strong>Obyektivka</strong>
        </div>
        <span class="service-arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <div class="home-bottom">
      <section class="home-guide" aria-label="Qanday ishlaydi">
        <p class="home-guide-title">Qanday ishlaydi</p>
        <ol class="home-steps">
          <li class="home-step">
            <span class="home-step-num" aria-hidden="true">1</span>
            <div class="home-step-body">
              <span class="home-step-label">Ovoz yoki matn</span>
              <span class="home-step-badge home-step-badge--free">Bepul</span>
            </div>
          </li>
          <li class="home-step">
            <span class="home-step-num" aria-hidden="true">2</span>
            <div class="home-step-body">
              <span class="home-step-label">AI to'ldiradi</span>
              <span class="home-step-badge home-step-badge--free">Bepul</span>
            </div>
          </li>
          <li class="home-step">
            <span class="home-step-num" aria-hidden="true">3</span>
            <div class="home-step-body">
              <span class="home-step-label">Demo yuklash</span>
              <span class="home-step-badge home-step-badge--free">Watermark</span>
            </div>
          </li>
          <li class="home-step">
            <span class="home-step-num" aria-hidden="true">4</span>
            <div class="home-step-body">
              <span class="home-step-label">Tayyor fayl</span>
              <span class="home-step-badge home-step-badge--paid">To'lov</span>
            </div>
          </li>
        </ol>
        <p class="home-price" id="homePriceTag">
          <span class="home-price-icon" aria-hidden="true">💰</span>
          <span>Tayyor fayl: 7 999 so'm</span>
        </p>
      </section>

      <footer class="home-footer">
        <span>@DastyorAiBot</span>
      </footer>
    </div>
  </div>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      var titleEl = document.getElementById('welcomeTitle');
      var creditsEl = document.getElementById('homeCredits');
      var priceTagEl = document.getElementById('homePriceTag');
      try { tg && tg.ready && tg.ready(); tg && tg.expand && tg.expand(); } catch (_) {}

      var theme = (tg && tg.colorScheme) || 'light';
      document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');

      if (tg && tg.onEvent) {
        tg.onEvent('themeChanged', function () {
          document.documentElement.setAttribute(
            'data-theme',
            tg.colorScheme === 'dark' ? 'dark' : 'light'
          );
        });
      }

      var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
      var name = u && (u.first_name || u.username) ? (u.first_name || u.username) : 'Foydalanuvchi';
      if (titleEl) titleEl.textContent = 'Salom, ' + name + ' 👋';

      var tid = u && u.id ? String(u.id) : '';
      if (tid) {
        try { sessionStorage.setItem('tg_id', tid); } catch (_) {}
        var q = '?telegram_id=' + encodeURIComponent(tid);
        var cv = document.getElementById('linkCv');
        var oby = document.getElementById('linkOby');
        if (cv) cv.href = 'cv.html' + q;
        if (oby) oby.href = 'obyektivka.html' + q + '&voice=1&autoload=1';
      }

      function showAccess(me) {
        if (!creditsEl) return;
        creditsEl.classList.remove('home-credits--loading');
        creditsEl.hidden = false;
        var parts = [];
        if (me && me.has_cv_access) parts.push('CV');
        if (me && me.has_objective_access) parts.push('Oby');
        creditsEl.textContent = parts.length
          ? '📄 Ochiq: ' + parts.join(', ')
          : '📄 Hujjat: to\'lov kerak';
      }

      function showPrice(amount) {
        if (!priceTagEl || !amount) return;
        var p = Number(amount);
        if (!p) return;
        var formatted = p.toLocaleString('fr-FR').replace(/\u202f/g, ' ').replace(/,/g, ' ');
        var textSpan = priceTagEl.querySelector('span:last-child');
        if (textSpan) {
          textSpan.textContent = 'Tayyor fayl: ' + formatted + " so'm";
        } else {
          priceTagEl.textContent = '💰 Tayyor fayl: ' + formatted + " so'm";
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        var DA = window.DastyorAI;
        if (!DA || !DA.init) return;
        DA.init({ refreshProfile: true }).then(function (me) {
          if (!me) return;
          showAccess(me);
          if (DA.docPriceUzs) showPrice(DA.docPriceUzs(me));
        }).catch(function () {});
        if (DA.bindPrefetchOnHover) DA.bindPrefetchOnHover('.service-card');
      });
    })();
  </script>
</body>
</html>
