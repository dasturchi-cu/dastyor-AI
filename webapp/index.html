<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dastyor AI — CV PDF va Obyektivka DOCX yaratish xizmati.">
  <meta name="theme-color" content="#2563eb">
  <title>Dastyor AI</title>
  <link rel="preload" href="theme.css" as="style">
  <link rel="stylesheet" href="theme.css">
  <link rel="prefetch" href="cv.html">
  <link rel="prefetch" href="obyektivka.html">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="app.js" defer></script>
  <style>
    :root {
      --home-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --home-radius: 18px;
      --home-radius-sm: 12px;
      --home-accent: var(--da-primary);
      --home-glass: rgba(255, 255, 255, 0.72);
      --home-glass-border: rgba(255, 255, 255, 0.55);
      --home-blob-1: rgba(37, 99, 235, 0.18);
      --home-blob-2: rgba(14, 165, 233, 0.14);
      --home-blob-3: rgba(99, 102, 241, 0.1);
    }

    html[data-theme="dark"] {
      --home-glass: rgba(30, 41, 59, 0.78);
      --home-glass-border: rgba(255, 255, 255, 0.1);
      --home-blob-1: rgba(59, 130, 246, 0.22);
      --home-blob-2: rgba(56, 189, 248, 0.12);
      --home-blob-3: rgba(129, 140, 248, 0.14);
    }

    body.home-page {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--home-font);
      background: var(--bg-color);
      color: var(--text-color);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .home-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .home-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, var(--home-blob-1), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 20%, var(--home-blob-2), transparent 50%),
        radial-gradient(ellipse 50% 35% at 0% 80%, var(--home-blob-3), transparent 45%);
    }

    .home-shell {
      position: relative;
      z-index: 1;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
    }

    /* Brand bar */
    .home-credits {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: var(--da-primary);
      background: var(--da-blue-soft);
      border: 1px solid var(--da-blue-mid);
      white-space: nowrap;
    }

    .home-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      animation: home-in 0.45s ease both;
    }

    .home-brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(145deg, #3b82f6 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.03em;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .home-brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .home-brand-text strong {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text-color);
    }

    .home-brand-text span {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Hero glass card */
    .home-hero {
      padding: 22px 20px;
      border-radius: var(--home-radius);
      background: var(--home-glass);
      border: 1px solid var(--home-glass-border);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        var(--da-shadow-sm);
      margin-bottom: 14px;
      animation: home-in 0.5s ease 0.05s both;
    }

    html[data-theme="dark"] .home-hero {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        var(--da-shadow-sm);
    }

    @media (prefers-reduced-transparency: reduce) {
      .home-hero {
        background: var(--card-color);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    .home-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--da-blue-soft);
      color: var(--da-primary);
      margin-bottom: 14px;
      border: 1px solid var(--da-blue-mid);
    }

    .home-hero h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--text-color);
    }

    .home-hero p {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Feature chips */
    .home-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      animation: home-in 0.5s ease 0.1s both;
    }

    .home-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--home-glass);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Service cards */
    .service-grid {
      display: grid;
      gap: 10px;
      flex: 1;
    }

    .service-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 16px 16px 14px;
      border-radius: var(--home-radius);
      border: 1px solid var(--home-glass-border);
      background: var(--home-glass);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      text-decoration: none;
      color: inherit;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        var(--da-shadow-xs);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      animation: home-in 0.5s ease both;
    }

    .service-card:nth-child(1) { animation-delay: 0.15s; }
    .service-card:nth-child(2) { animation-delay: 0.22s; }

    .service-card:active {
      transform: scale(0.98);
      box-shadow: var(--da-shadow-xs);
    }

    html[data-theme="dark"] .service-card {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        var(--da-shadow-xs);
    }

    @media (prefers-reduced-transparency: reduce) {
      .service-card, .home-chip {
        background: var(--card-color);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    .service-icon-wrap {
      width: 46px;
      height: 46px;
      border-radius: var(--home-radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .service-icon-wrap.cv {
      background: linear-gradient(145deg, rgba(37, 99, 235, 0.15), rgba(37, 99, 235, 0.06));
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .service-icon-wrap.oby {
      background: linear-gradient(145deg, rgba(14, 165, 233, 0.15), rgba(14, 165, 233, 0.06));
      border: 1px solid rgba(14, 165, 233, 0.22);
    }

    .service-meta {
      flex: 1;
      min-width: 0;
    }

    .service-meta strong {
      display: block;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 3px;
      color: var(--text-color);
    }

    .service-meta span {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .service-arrow {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--da-blue-soft);
      color: var(--da-primary);
      font-size: 16px;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* Footer */
    .home-footer {
      margin-top: auto;
      padding-top: 28px;
      text-align: center;
      animation: home-in 0.5s ease 0.3s both;
    }

    .home-footer span {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      opacity: 0.7;
    }

    @keyframes home-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .home-brand, .home-hero, .home-chips, .service-card, .home-footer {
        animation: none;
      }
      .service-card:active { transform: none; }
    }
  </style>
</head>
<body class="home-page" data-disable-mobile-nav="true">
  <div class="home-bg" aria-hidden="true"></div>

  <div class="home-shell">
    <header class="home-brand">
      <div class="home-brand-mark" aria-hidden="true">DA</div>
      <div class="home-brand-text">
        <strong>DASTYOR AI</strong>
        <span>CV PDF · Obyektivka DOCX</span>
      </div>
      <span class="home-credits" id="homeCredits" hidden>💳 —</span>
    </header>

    <section class="home-hero">
      <div class="home-badge">⚡ AI Voice Fill</div>
      <h1 id="welcomeTitle">Salom 👋</h1>
      <p>Professional hujjat yaratish. Bir bosish, tayyor natija.</p>
    </section>

    <div class="home-chips" aria-label="Xususiyatlar">
      <span class="home-chip">⚡ AI Voice</span>
      <span class="home-chip">📄 CV PDF</span>
      <span class="home-chip">📋 DOCX</span>
    </div>

    <nav class="service-grid" aria-label="Xizmatlar">
      <a class="service-card" href="cv.html" id="linkCv">
        <div class="service-icon-wrap cv" aria-hidden="true">📄</div>
        <div class="service-meta">
          <strong>CV Resume</strong>
          <span>PDF · ATS Friendly · Ovoz yoki forma</span>
        </div>
        <span class="service-arrow" aria-hidden="true">→</span>
      </a>
      <a class="service-card" href="obyektivka.html?voice=1" id="linkOby">
        <div class="service-icon-wrap oby" aria-hidden="true">📋</div>
        <div class="service-meta">
          <strong>Obyektivka</strong>
          <span>Word (.docx) · AI Voice Fill</span>
        </div>
        <span class="service-arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <footer class="home-footer">
      <span>@DastyorAiBot</span>
    </footer>
  </div>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      var titleEl = document.getElementById('welcomeTitle');
      var creditsEl = document.getElementById('homeCredits');
      try { tg && tg.ready && tg.ready(); tg && tg.expand && tg.expand(); } catch (_) {}

      var theme = (tg && tg.colorScheme) || 'light';
      document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');

      if (tg && tg.onEvent) {
        tg.onEvent('themeChanged', function () {
          document.documentElement.setAttribute(
            'data-theme',
            tg.colorScheme === 'dark' ? 'dark' : 'light'
          );
        });
      }

      var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
      var name = u && (u.first_name || u.username) ? (u.first_name || u.username) : 'Foydalanuvchi';
      if (titleEl) titleEl.textContent = 'Salom, ' + name + ' 👋';

      var tid = u && u.id ? String(u.id) : '';
      if (tid) {
        try { sessionStorage.setItem('tg_id', tid); } catch (_) {}
        var q = '?telegram_id=' + encodeURIComponent(tid);
        var cv = document.getElementById('linkCv');
        var oby = document.getElementById('linkOby');
        if (cv) cv.href = 'cv.html' + q;
        if (oby) oby.href = 'obyektivka.html' + q + '&voice=1&autoload=1';
      }

      function showCredits(n) {
        if (!creditsEl) return;
        creditsEl.hidden = false;
        creditsEl.textContent = '💳 ' + n + ' kredit';
      }

      document.addEventListener('DOMContentLoaded', function () {
        var DA = window.DastyorAI;
        if (!DA || !DA.init) return;
        DA.init({ refreshProfile: true }).then(function (me) {
          if (!me) return;
          var n = DA.getCredits ? DA.getCredits(me) : Number(me.credits || 0);
          showCredits(n);
        }).catch(function () {});
        if (DA.bindPrefetchOnHover) DA.bindPrefetchOnHover('.service-card');
      });
    })();
  </script>
</body>
</html>
