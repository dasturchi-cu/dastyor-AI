<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dastyor AI: CV va Obyektivka yaratish xizmati.">
  <title>Dastyor AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#f5f8ff;--card:#fff;--border:#dbe8ff;--text:#0f172a;--muted:#4b5d7a;--brand:#1d6fe8;--brand2:#1558bd}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#f5f8ff 0%,#eef4ff 100%);color:var(--text);font-family:Arial,sans-serif}
    main{max-width:560px;margin:0 auto;padding:28px 14px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(17,44,94,.08)}
    .hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .avatar{width:42px;height:42px;border-radius:999px;overflow:hidden;border:1px solid var(--border);background:#dbe8ff;display:flex;align-items:center;justify-content:center;font-weight:700;color:#335}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    h1{margin:0 0 8px;font-size:30px;line-height:1.15}
    p{margin:0 0 16px;color:var(--muted);font-size:14px}
    .btn{display:block;text-decoration:none;text-align:center;background:linear-gradient(180deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;font-weight:700;border-radius:11px;padding:12px 14px;margin-top:10px}
    .btn:hover{filter:brightness(1.03)}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-label="Asosiy xizmatlar">
      <div class="hero">
        <h1 id="welcomeTitle">Salom 👋</h1>
        <div id="welcomeAvatar" class="avatar" aria-label="Profil rasmi">U</div>
      </div>
      <p>Kerakli xizmatni tanlang.</p>
      <a class="btn" href="cv.html">CV yaratish</a>
      <a class="btn" href="obyektivka.html">Obyektivka yaratish</a>
    </section>
  </main>
  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      const titleEl = document.getElementById("welcomeTitle");
      const avatarEl = document.getElementById("welcomeAvatar");
      const fallback = "Foydalanuvchi";

      try { tg && tg.ready && tg.ready(); } catch (_) {}
      try { tg && tg.expand && tg.expand(); } catch (_) {}

      const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
      const name = (u && (u.first_name || u.username)) ? (u.first_name || u.username) : fallback;

      if (titleEl) titleEl.textContent = "Salom, " + name + " 👋";
      if (!avatarEl) return;

      const photo = u && u.photo_url ? String(u.photo_url).trim() : "";
      if (photo) {
        avatarEl.innerHTML = '<img src=\"' + photo + '\" alt=\"avatar\" referrerpolicy=\"no-referrer\">';
      } else {
        avatarEl.textContent = (name || "U").charAt(0).toUpperCase();
      }
    })();
  </script>
</body>
</html>
