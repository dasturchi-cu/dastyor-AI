<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OCR Scanner | Dastyor AI</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            blue: '#2563EB',
                            green: '#30D158',
                            orange: '#FF9F0A',
                            purple: '#BF5AF2',
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        body { background: var(--bg-color); color: var(--text-color); min-height: 100vh; }
        .scroller::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="antialiased selection:bg-apple-blue selection:text-white flex flex-col h-screen overflow-hidden">

<!-- Global Header (match translit.html) -->
<header class="h-16 flex-shrink-0 border-b border-black/5 dark:border-white/5 bg-white/80 dark:bg-[#0a0a0c]/80 backdrop-blur-xl flex items-center px-4 z-50">
    <a href="more.html"
        class="w-10 h-10 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 transition-colors flex items-center justify-center shrink-0"
        id="backBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
        </svg>
    </a>
    <div class="ml-4 flex-1">
        <h1 class="font-display font-bold text-lg tracking-tight leading-tight flex items-center gap-2">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <rect x="3" y="6" width="18" height="12" rx="2" />
                <circle cx="12" cy="12" r="3" />
                <path d="M8 6l1.5-2h5L16 6" />
            </svg>
            <span>Rasm → Matn</span>
        </h1>
        <p class="text-[10px] font-semibold text-black/40 dark:text-white/40 uppercase tracking-widest">
            OCR 📷 <span id="statsBadge">fayl tanlanmagan</span>
        </p>
    </div>
</header>

<main class="flex-1 overflow-y-auto scroller relative flex flex-col">
    <div class="max-w-3xl w-full mx-auto p-4 md:p-6 flex flex-col h-full gap-4">

        <!-- Upload Card -->
        <div class="flex flex-col bg-white dark:bg-[#151518] border border-black/5 dark:border-white/5 rounded-[24px] overflow-hidden shadow-sm animate-slide-up">
            <div class="flex items-center justify-between px-5 py-3 border-b border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02]">
                <span class="text-[11px] font-bold text-apple-blue uppercase tracking-widest">Rasm yuklash</span>
                <button onclick="clearSelection()" class="text-black/30 dark:text-white/30 hover:text-black dark:hover:text-white transition-colors text-sm font-bold">✕</button>
            </div>

            <div class="p-5">
                <input type="file" id="fileInput" accept="image/*" hidden />

                <div id="dropZone"
                    class="border-2 border-dashed border-black/10 dark:border-white/10 rounded-2xl bg-black/[0.02] dark:bg-white/[0.03] hover:bg-black/[0.04] dark:hover:bg-white/[0.06] transition-colors p-6 text-center cursor-pointer">
                    <div class="mx-auto w-14 h-14 rounded-2xl bg-apple-blue/10 text-apple-blue flex items-center justify-center mb-4">
                        <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="17 8 12 3 7 8" />
                            <line x1="12" y1="3" x2="12" y2="15" />
                        </svg>
                    </div>
                    <div class="font-bold text-base text-black dark:text-white">Rasm yuklash</div>
                    <div class="text-sm text-black/50 dark:text-white/50 mt-1">Tap yoki drag &amp; drop</div>
                    <div class="mt-4 flex flex-wrap gap-2 justify-center">
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-black/5 dark:bg-white/5 text-black/50 dark:text-white/50 border border-black/5 dark:border-white/10">PNG</span>
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-black/5 dark:bg-white/5 text-black/50 dark:text-white/50 border border-black/5 dark:border-white/10">JPG</span>
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-black/5 dark:bg-white/5 text-black/50 dark:text-white/50 border border-black/5 dark:border-white/10">WEBP</span>
                    </div>
                </div>

                <div id="fileName" class="mt-4 hidden rounded-2xl border border-black/5 dark:border-white/10 bg-black/[0.02] dark:bg-white/[0.03] p-4">
                    <div class="text-xs font-bold text-black/40 dark:text-white/40 uppercase tracking-widest">Tanlangan fayl</div>
                    <div id="fileNameText" class="mt-1 font-semibold text-black dark:text-white text-sm"></div>
                </div>

                <button id="convertBtn"
                    class="mt-4 w-full py-4 rounded-2xl bg-apple-blue hover:brightness-110 active:scale-[0.98] text-white font-bold text-lg shadow-[0_8px_30px_rgba(37,99,235,0.30)] transition-all flex justify-center items-center gap-2"
                    disabled>
                    <span>⚡ Matnni ajratish</span>
                </button>

                <div id="status" class="mt-3"></div>
                <pre id="ocrText"
                    class="mt-3 hidden rounded-2xl border border-black/5 dark:border-white/10 bg-black/[0.02] dark:bg-white/[0.03] p-4 text-sm whitespace-pre-wrap break-words text-black dark:text-white"></pre>
            </div>
        </div>

    </div>
</main>

<script>
    const tg = window.Telegram?.WebApp;
    let selectedFile = null;
    let optimizedFile = null;

    function showStatus(type, text) {
        const el = document.getElementById("status");
        const icon = type === "loading" ? "⏳" : (type === "success" ? "✅" : "⚠️");
        const cls = type === "success"
            ? "border-apple-green/20 bg-apple-green/10 text-apple-green"
            : type === "error"
                ? "border-red-500/20 bg-red-500/10 text-red-500"
                : "border-black/10 bg-black/5 text-black/70 dark:border-white/10 dark:bg-white/5 dark:text-white/70";
        el.className = `flex items-center gap-2 p-3 rounded-xl text-sm font-semibold border ${cls}`;
        el.innerHTML = `<span>${icon}</span><span>${text}</span>`;
    }

    function bindFile(file) {
        if (!file || !file.type.startsWith("image/")) return;
        selectedFile = file;
        optimizedFile = null;
        document.getElementById("fileName").classList.remove("hidden");
        document.getElementById("fileNameText").textContent = `${file.name} (${Math.round(file.size / 1024)} KB)`;
        document.getElementById("convertBtn").disabled = false;
        document.getElementById("statsBadge").textContent = "1 fayl tanlandi";
    }
    function clearSelection() {
        selectedFile = null;
        optimizedFile = null;
        const fi = document.getElementById("fileInput");
        if (fi) fi.value = "";
        document.getElementById("fileName").classList.add("hidden");
        document.getElementById("fileNameText").textContent = "";
        document.getElementById("convertBtn").disabled = true;
        document.getElementById("statsBadge").textContent = "fayl tanlanmagan";
        const st = document.getElementById("status");
        st.className = "";
        st.innerHTML = "";
        const textOut = document.getElementById("ocrText");
        textOut.textContent = "";
        textOut.classList.add("hidden");
        tg?.HapticFeedback?.impactOccurred?.("light");
    }

    async function optimizeImageForOCR(file) {
        // Telegram mobil uchun: rasmni siqish/resize → tezroq upload + tezroq OCR
        // Max dimension: 1600px, JPEG quality: 0.82
        const MAX_DIM = 1600;
        const QUALITY = 0.82;
        if (!file || !file.type.startsWith("image/")) return file;
        try {
            const bmp = await createImageBitmap(file);
            // Always resize if pixel dimensions are large (even if file size is small).
            const maxSide = Math.max(bmp.width, bmp.height);
            if (maxSide <= MAX_DIM) {
                bmp.close?.();
                return file;
            }
            const scale = MAX_DIM / maxSide;
            const w = Math.max(1, Math.round(bmp.width * scale));
            const h = Math.max(1, Math.round(bmp.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d", { alpha: false });
            ctx.drawImage(bmp, 0, 0, w, h);
            bmp.close?.();
            const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", QUALITY));
            if (!blob) return file;
            // Agar kamaymasa, originalni qoldiramiz
            if (blob.size >= file.size) return file;
            return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
        } catch (_) {
            return file;
        }
    }

    async function convertToWord() {
        if (!selectedFile) return;
        showStatus("loading", "Rasm tayyorlanmoqda...");
        document.getElementById("convertBtn").disabled = true;
        try {
            if (!optimizedFile) {
                showStatus("loading", "Rasm siqilmoqda...");
                optimizedFile = await optimizeImageForOCR(selectedFile);
            }
            showStatus("loading", "Matn ajratilmoqda...");
            const qs = new URLSearchParams(location.search);
            const normalizeBase = (u) => String(u || "").trim().replace(/\/+$/, "");
            const baseCandidates = [
                qs.get("api"),
                window.DastyorAI?.BASE,
                "https://dastyor-ai.onrender.com",
                location.origin
            ]
                .map(normalizeBase)
                .filter((v, i, arr) => v && arr.indexOf(v) === i);

            const pathCandidates = ["/ocr", "/api/ocr"];
            let res = null;
            let usedBase = "";

            for (const base of baseCandidates) {
                for (const path of pathCandidates) {
                    try {
                        const fd = new FormData();
                        fd.append("file", optimizedFile || selectedFile);
                        const r = await fetch(base + path, { method: "POST", body: fd });
                        res = r;
                        usedBase = base;
                        // Use first non-404 response immediately
                        if (r.status !== 404) break;
                    } catch (_) {
                        // try next candidate
                    }
                }
                if (res && res.status !== 404) break;
            }

            if (!res) {
                throw new Error("Internet yoki serverga ulanib bo'lmadi. Keyinroq urinib ko'ring.");
            }
            if (res.status === 404) {
                throw new Error("OCR endpoint topilmadi (404). Server routingni tekshiring.");
            }

            if (!res.ok) {
                let msg = "OCR xatosi";
                try {
                    const err = await res.json();
                    msg = err.detail || err.error || msg;
                } catch (_) {}
                throw new Error(msg + ` (HTTP ${res.status})`);
            }

            const data = await res.json();

            async function pollJob(base, jobId) {
                let delay = 500;
                const maxDelay = 2500;
                const deadline = Date.now() + 120000; // 2 minutes
                while (Date.now() < deadline) {
                    let jr = null;
                    try {
                        const r = await fetch(base + "/api/jobs/" + jobId);
                        jr = r.ok ? await r.json() : null;
                    } catch (_) {}
                    const st = jr?.status;
                    if (st === "succeeded") return jr?.result || {};
                    if (st === "failed") throw new Error(jr?.error || "OCR xatosi");
                    await new Promise((r) => setTimeout(r, delay));
                    delay = Math.min(maxDelay, Math.round(delay * 1.25));
                }
                throw new Error("OCR juda uzoq davom etdi. Keyinroq urinib ko'ring.");
            }

            // New async flow: /api/ocr returns { job_id }, then poll /api/jobs/{job_id}
            let text = String(data?.text || "").trim();
            if (!text && data?.job_id) {
                showStatus("loading", "Navbatda... matn ajratilmoqda");
                const base = usedBase || location.origin;
                const result = await pollJob(base, String(data.job_id));
                text = String(result?.text || "").trim();
            }

            if (!text) throw new Error("Rasmdan matn topilmadi");
            const textOut = document.getElementById("ocrText");
            textOut.textContent = text;
            textOut.classList.remove("hidden");
            showStatus("success", "Matn ajratildi");
            tg?.HapticFeedback?.notificationOccurred?.("success");
        } catch (e) {
            showStatus("error", e.message || "Xatolik yuz berdi");
            tg?.HapticFeedback?.notificationOccurred?.("error");
        } finally {
            document.getElementById("convertBtn").disabled = false;
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        if (window.DastyorAI && window.DastyorAI.initUI) DastyorAI.initUI({ autoNavLinks: true });
        const drop = document.getElementById("dropZone");
        const input = document.getElementById("fileInput");
        drop.addEventListener("click", () => input.click());
        input.addEventListener("change", (e) => bindFile(e.target.files?.[0]));
        drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("ring-2", "ring-apple-blue/40", "bg-apple-blue/5"); });
        drop.addEventListener("dragleave", () => drop.classList.remove("ring-2", "ring-apple-blue/40", "bg-apple-blue/5"));
        drop.addEventListener("drop", (e) => {
            e.preventDefault();
            drop.classList.remove("ring-2", "ring-apple-blue/40", "bg-apple-blue/5");
            if (e.dataTransfer.files?.[0]) bindFile(e.dataTransfer.files[0]);
        });
        document.getElementById("convertBtn").addEventListener("click", convertToWord);
        document.getElementById("backBtn").onclick = (e) => {
            e.preventDefault();
            location.href = 'more.html';
        };
        tg?.ready?.();
        tg?.expand?.();
    });
</script>
</body>
</html>
