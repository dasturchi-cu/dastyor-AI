<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OCR Scanner | Dastyor AI</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="da-core.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
    <script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
    <style>
        .page { max-width: 520px; margin: 0 auto; padding: 14px 14px 108px; }
        .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .back-btn {
            width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border-color);
            background: var(--card-color); display: inline-flex; align-items: center; justify-content: center;
            text-decoration: none; color: var(--text-color); flex-shrink: 0;
        }
        .back-btn svg { width: 20px; height: 20px; stroke: currentColor; }
        .head h1 { font-size: 24px; margin: 0 0 3px 0; }
        .head p { margin: 0; font-size: 14px; color: var(--text-muted); }

        .card { background: var(--card-color); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--da-shadow-sm); padding: 14px; margin-bottom: 12px; }
        .drop-zone {
            border: 2px dashed var(--da-blue-mid);
            border-radius: 14px;
            background: var(--da-blue-soft);
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 8px;
            cursor: pointer;
            padding: 12px;
        }
        .drop-zone.dragover { border-color: var(--da-blue); background: rgba(37,99,235,0.14); }
        .drop-zone h3 { font-size: 16px; margin: 0; }
        .drop-zone p { margin: 0; font-size: 13px; color: var(--text-muted); }
        .file-name {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-muted);
            background: var(--da-bg-elevated);
        }
        .result-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 8px;
        }
        .result-box {
            width: 100%;
            min-height: 180px;
            border: 1px solid var(--border-color);
            background: var(--da-bg-elevated);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            color: var(--text-color);
            line-height: 1.55;
            resize: vertical;
        }
        .btn-row {
            display: grid;
            gap: 10px;
            margin-top: 10px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .btn-row button { width: 100%; }
        .status { margin-top: 10px; }
        @media (max-width: 420px) {
            .btn-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<main class="page">
    <div class="head">
        <a class="back-btn" href="more.html">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="m15 18-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div>
            <h1>OCR Scanner</h1>
            <p>Rasm yuklang va matnni oling</p>
        </div>
    </div>

    <section class="card">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <div id="dropZone" class="drop-zone">
            <svg width="34" height="34" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <h3>Rasm yuklash</h3>
            <p>Tap yoki drag & drop</p>
        </div>
        <div id="fileName" class="file-name" style="display:none;"></div>
        <button id="scanBtn" class="btn btn-primary" style="margin-top:10px;" disabled>Matnni aniqlash</button>
        <div id="status" class="da-status status"></div>
    </section>

    <section class="card">
        <div class="result-title">Aniqlangan matn</div>
        <textarea id="resultText" class="result-box" placeholder="Natija shu yerda chiqadi..." readonly></textarea>
        <div class="btn-row">
            <button id="copyBtn" class="btn">Matnni nusxalash</button>
            <button id="downloadBtn" class="btn btn-primary" disabled>Word yuklash</button>
        </div>
    </section>
</main>

<script>
    const tg = window.Telegram?.WebApp;
    let selectedFile = null;
    let detectedText = "";
    let optimizedFile = null;

    function showStatus(type, text) {
        const el = document.getElementById("status");
        el.className = "da-status show status " + type;
        const icon = type === "loading" ? '<span class="da-spinner"></span>' : (type === "success" ? "✓" : "!");
        el.innerHTML = `${icon}<span>${text}</span>`;
    }

    function bindFile(file) {
        if (!file || !file.type.startsWith("image/")) return;
        selectedFile = file;
        optimizedFile = null;
        document.getElementById("fileName").style.display = "block";
        document.getElementById("fileName").textContent = `Tanlangan fayl: ${file.name}`;
        document.getElementById("scanBtn").disabled = false;
        document.getElementById("downloadBtn").disabled = false;
        document.getElementById("resultText").value = "";
        detectedText = "";
    }

    async function optimizeImageForOCR(file) {
        // Telegram mobil uchun: rasmni siqish/resize → tezroq upload + tezroq OCR
        // Max dimension: 1600px, JPEG quality: 0.82
        const MAX_DIM = 1600;
        const QUALITY = 0.82;
        if (!file || !file.type.startsWith("image/")) return file;
        // Kichik fayl bo'lsa o'zgartirmaymiz
        if (file.size <= 900 * 1024) return file;
        try {
            const bmp = await createImageBitmap(file);
            const scale = Math.min(1, MAX_DIM / Math.max(bmp.width, bmp.height));
            const w = Math.max(1, Math.round(bmp.width * scale));
            const h = Math.max(1, Math.round(bmp.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d", { alpha: false });
            ctx.drawImage(bmp, 0, 0, w, h);
            bmp.close?.();
            const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", QUALITY));
            if (!blob) return file;
            // Agar kamaymasa, originalni qoldiramiz
            if (blob.size >= file.size) return file;
            return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
        } catch (_) {
            return file;
        }
    }

    async function runOCR() {
        if (!selectedFile) return;
        showStatus("loading", "Rasm tayyorlanmoqda...");
        document.getElementById("scanBtn").disabled = true;
        try {
            if (!optimizedFile) {
                showStatus("loading", "Rasm siqilmoqda...");
                optimizedFile = await optimizeImageForOCR(selectedFile);
            }
            showStatus("loading", "Matn aniqlanmoqda...");
            const fd = new FormData();
            fd.append("file", optimizedFile);
            const apiBase = (location.protocol === "file:" ? "https://dastyor-ai.onrender.com" : location.origin);
            // Tez rejim: server Word yasamasdan faqat matnni qaytaradi (mode=text)
            fd.append("mode", "text");
            const tid = (window.DA?.getTelegramId && window.DA.getTelegramId()) || new URLSearchParams(location.search).get("telegram_id") || "";
            if (tid) fd.append("telegram_id", tid);

            let res = await fetch(apiBase + "/api/ocr_direct", {
                method: "POST",
                body: fd
            });

            if (!res.ok) {
                let msg = "OCR xatosi";
                try { const err = await res.json(); msg = err.detail || msg; } catch (_) {}
                throw new Error(msg);
            }

            // Eski serverlarda mode=text qo'llanmasa DOCX qaytishi mumkin — shunda mammoth bilan text chiqaramiz
            const ct = (res.headers.get("content-type") || "").toLowerCase();
            if (ct.includes("application/json")) {
                const data = await res.json();
                detectedText = (data.text || "").trim() || "Matn topilmadi yoki o'qib bo'lmadi.";
            } else {
                const blob = await res.blob();
                const arr = await blob.arrayBuffer();
                let text = "";
                try {
                    const parsed = await window.mammoth.extractRawText({ arrayBuffer: arr });
                    text = (parsed.value || "").trim();
                } catch (_) {
                    text = "";
                }
                detectedText = text || "Matn topilmadi yoki o'qib bo'lmadi.";
            }
            document.getElementById("resultText").value = detectedText;
            showStatus("success", "Matn muvaffaqiyatli aniqlandi");
            tg?.HapticFeedback?.notificationOccurred?.("success");
        } catch (e) {
            showStatus("error", e.message || "Xatolik yuz berdi");
            tg?.HapticFeedback?.notificationOccurred?.("error");
        } finally {
            document.getElementById("scanBtn").disabled = false;
        }
    }

    async function copyText() {
        if (!detectedText) return;
        try {
            await navigator.clipboard.writeText(detectedText);
            showStatus("success", "Matn nusxalandi");
        } catch (_) {
            showStatus("error", "Nusxalashda xatolik");
        }
    }

    async function downloadWord() {
        if (!selectedFile) return;
        showStatus("loading", "Rasm siqilmoqda...");
        try {
            if (!optimizedFile) optimizedFile = await optimizeImageForOCR(selectedFile);
            showStatus("loading", "Word fayl tayyorlanmoqda...");
            const fd = new FormData();
            fd.append("file", optimizedFile || selectedFile);
            const tid = (window.DA?.getTelegramId && window.DA.getTelegramId()) || new URLSearchParams(location.search).get("telegram_id") || "";
            if (tid) fd.append("telegram_id", tid);
            const res = await fetch((location.protocol === "file:" ? "https://dastyor-ai.onrender.com" : location.origin) + "/api/ocr_direct", {
                method: "POST",
                body: fd
            });
            if (!res.ok) {
                let msg = "Word yaratishda xatolik";
                try { const err = await res.json(); msg = err.detail || msg; } catch (_) {}
                throw new Error(msg);
            }
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `OCR_${Date.now()}.docx`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
            showStatus("success", "Word fayl yuklandi");
            tg?.HapticFeedback?.notificationOccurred?.("success");
        } catch (e) {
            showStatus("error", e.message || "Xatolik");
            tg?.HapticFeedback?.notificationOccurred?.("error");
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        if (window.DastyorAI && window.DastyorAI.initUI) DastyorAI.initUI({ autoNavLinks: true });
        const drop = document.getElementById("dropZone");
        const input = document.getElementById("fileInput");
        drop.addEventListener("click", () => input.click());
        input.addEventListener("change", (e) => bindFile(e.target.files?.[0]));
        drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("dragover"); });
        drop.addEventListener("dragleave", () => drop.classList.remove("dragover"));
        drop.addEventListener("drop", (e) => {
            e.preventDefault();
            drop.classList.remove("dragover");
            if (e.dataTransfer.files?.[0]) bindFile(e.dataTransfer.files[0]);
        });
        document.getElementById("scanBtn").addEventListener("click", runOCR);
        document.getElementById("copyBtn").addEventListener("click", copyText);
        document.getElementById("downloadBtn").addEventListener("click", downloadWord);
        tg?.ready?.();
        tg?.expand?.();
    });
</script>
</body>
</html>
