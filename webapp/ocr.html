<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OCR Scanner | Dastyor AI</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            blue: '#2563EB',
                            green: '#30D158',
                            orange: '#FF9F0A',
                            purple: '#BF5AF2',
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        body { background: var(--bg-color); color: var(--text-color); min-height: 100vh; }
        .scroller::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="antialiased selection:bg-apple-blue selection:text-white flex flex-col h-screen overflow-hidden">

<!-- Global Header (match translit.html) -->
<header class="h-16 flex-shrink-0 border-b border-black/5 dark:border-white/5 bg-white/80 dark:bg-[#0a0a0c]/80 backdrop-blur-xl flex items-center px-4 z-50">
    <a href="more.html"
        class="w-10 h-10 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 transition-colors flex items-center justify-center shrink-0"
        id="backBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
        </svg>
    </a>
    <div class="ml-4 flex-1">
        <h1 class="font-display font-bold text-lg tracking-tight leading-tight flex items-center gap-2">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <rect x="3" y="6" width="18" height="12" rx="2" />
                <circle cx="12" cy="12" r="3" />
                <path d="M8 6l1.5-2h5L16 6" />
            </svg>
            <span>Rasm → Matn</span>
        </h1>
        <p class="text-[10px] font-semibold text-black/40 dark:text-white/40 uppercase tracking-widest">
            OCR 📷 <span id="statsBadge">fayl tanlanmagan</span>
        </p>
    </div>
</header>

<main class="flex-1 overflow-y-auto scroller relative flex flex-col">
    <div class="max-w-3xl w-full mx-auto p-4 md:p-6 flex flex-col h-full gap-4">

        <div id="ocrQuotaWarn" class="hidden rounded-xl border border-red-200 bg-red-50 dark:bg-red-950/40 text-red-800 dark:text-red-200 text-xs font-semibold px-3 py-2 text-center" role="alert"></div>

        <!-- Upload Card -->
        <div class="flex flex-col bg-white dark:bg-[#151518] border border-black/5 dark:border-white/5 rounded-[24px] overflow-hidden shadow-sm animate-slide-up">
            <div class="flex items-center justify-between px-5 py-3 border-b border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02]">
                <span class="text-[11px] font-bold text-apple-blue uppercase tracking-widest">Rasm yuklash</span>
                <button onclick="clearSelection()" class="text-black/30 dark:text-white/30 hover:text-black dark:hover:text-white transition-colors text-sm font-bold">✕</button>
            </div>

            <div class="p-5">
                <input type="file" id="fileInput" accept="image/*" hidden />

                <div id="dropZone"
                    class="border-2 border-dashed border-black/10 dark:border-white/10 rounded-2xl bg-black/[0.02] dark:bg-white/[0.03] hover:bg-black/[0.04] dark:hover:bg-white/[0.06] transition-colors p-6 text-center cursor-pointer">
                    <div class="mx-auto w-14 h-14 rounded-2xl bg-apple-blue/10 text-apple-blue flex items-center justify-center mb-4">
                        <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="17 8 12 3 7 8" />
                            <line x1="12" y1="3" x2="12" y2="15" />
                        </svg>
                    </div>
                    <div class="font-bold text-base text-black dark:text-white">Rasm yuklash</div>
                    <div class="text-sm text-black/50 dark:text-white/50 mt-1">Tap yoki drag &amp; drop</div>
                    <div class="mt-4 flex flex-wrap gap-2 justify-center">
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-black/5 dark:bg-white/5 text-black/50 dark:text-white/50 border border-black/5 dark:border-white/10">PNG</span>
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-black/5 dark:bg-white/5 text-black/50 dark:text-white/50 border border-black/5 dark:border-white/10">JPG</span>
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-black/5 dark:bg-white/5 text-black/50 dark:text-white/50 border border-black/5 dark:border-white/10">WEBP</span>
                    </div>
                </div>

                <div id="fileName" class="mt-4 hidden rounded-2xl border border-black/5 dark:border-white/10 bg-black/[0.02] dark:bg-white/[0.03] p-4">
                    <div class="text-xs font-bold text-black/40 dark:text-white/40 uppercase tracking-widest">Tanlangan fayl</div>
                    <div id="fileNameText" class="mt-1 font-semibold text-black dark:text-white text-sm"></div>
                </div>

                <button id="convertBtn"
                    class="mt-4 w-full py-4 rounded-2xl bg-apple-blue hover:brightness-110 active:scale-[0.98] text-white font-bold text-lg shadow-[0_8px_30px_rgba(37,99,235,0.30)] transition-all flex justify-center items-center gap-2"
                    disabled>
                    <span>📄 Rasm → Word (1:1)</span>
                </button>
                <button id="wordBtn" type="button"
                    class="hidden mt-2 w-full py-3 rounded-2xl border-2 border-apple-blue/40 text-apple-blue font-bold text-sm hover:bg-apple-blue/5 transition-all disabled:opacity-40 disabled:pointer-events-none"
                    disabled>
                    📄 Word (1:1 — bot bilan bir xil)
                </button>

                <div id="status" class="mt-3"></div>
                <div id="ocrText"
                    class="mt-3 hidden rounded-2xl border border-black/5 dark:border-white/10 bg-black/[0.02] dark:bg-white/[0.03] p-4 text-sm break-words text-black dark:text-white overflow-x-auto"></div>
            </div>
        </div>

    </div>
</main>

<script>
    const tg = window.Telegram?.WebApp;
    let selectedFile = null;
    let optimizedFile = null;
    /** Ko‘rinishdagi OCR HTML (Gemini `html` yoki Paddle `html_layout`) — Word 1:1 shu matndan, qayta OCRsiz */
    let lastOcrDocxHtml = "";

    function ocrTelegramId() {
        const raw = window.DastyorAI?.getTelegramId?.()
            || new URLSearchParams(location.search).get("telegram_id")
            || sessionStorage.getItem("tg_id")
            || tg?.initDataUnsafe?.user?.id;
        return raw != null ? String(raw) : "";
    }

    function ocrAppendAuth(fd) {
        const tid = ocrTelegramId();
        if (tid && /^\d+$/.test(tid)) fd.append("telegram_id", tid);
        try {
            const tok = window.DastyorAI?.getToken?.() || sessionStorage.getItem("tg_token");
            if (tok) fd.append("token", tok);
        } catch (_) { /* ignore */ }
    }

    function syncOcrQuotaUi() {
        const DA = window.DastyorAI;
        const blocked = DA && DA.isQuotaBlockedForCategory && DA.getUser && DA.isQuotaBlockedForCategory(DA.getUser(), "ocr");
        const hasFile = !!selectedFile;
        const c = document.getElementById("convertBtn");
        const w = document.getElementById("wordBtn");
        const warn = document.getElementById("ocrQuotaWarn");
        const dz = document.getElementById("dropZone");
        if (c) c.disabled = !!blocked || !hasFile;
        if (w) w.disabled = !!blocked || !hasFile;
        if (warn) {
            if (blocked) {
                warn.classList.remove("hidden");
                warn.textContent = "⛔ AI skayner (OCR) limiti tugadi. Keyingi kun yoki tarifni yangilang.";
            } else {
                warn.classList.add("hidden");
                warn.textContent = "";
            }
        }
        if (dz) {
            if (blocked) {
                dz.classList.add("pointer-events-none", "opacity-50");
                dz.setAttribute("aria-disabled", "true");
            } else {
                dz.classList.remove("pointer-events-none", "opacity-50");
                dz.removeAttribute("aria-disabled");
            }
        }
    }

    function showStatus(type, text) {
        const el = document.getElementById("status");
        const icon = type === "loading" ? "⏳" : (type === "success" ? "✅" : "⚠️");
        const cls = type === "success"
            ? "border-apple-green/20 bg-apple-green/10 text-apple-green"
            : type === "error"
                ? "border-red-500/20 bg-red-500/10 text-red-500"
                : "border-black/10 bg-black/5 text-black/70 dark:border-white/10 dark:bg-white/5 dark:text-white/70";
        el.className = `flex items-center gap-2 p-3 rounded-xl text-sm font-semibold border ${cls}`;
        el.innerHTML = `<span>${icon}</span><span>${text}</span>`;
    }

    function bindFile(file) {
        if (!file || !file.type.startsWith("image/")) return;
        selectedFile = file;
        optimizedFile = null;
        lastOcrDocxHtml = "";
        document.getElementById("fileName").classList.remove("hidden");
        document.getElementById("fileNameText").textContent = `${file.name} (${Math.round(file.size / 1024)} KB)`;
        document.getElementById("convertBtn").disabled = false;
        const wb = document.getElementById("wordBtn");
        if (wb) wb.disabled = false;
        document.getElementById("statsBadge").textContent = "1 fayl tanlandi";
        syncOcrQuotaUi();
    }
    function clearSelection() {
        selectedFile = null;
        optimizedFile = null;
        lastOcrDocxHtml = "";
        const fi = document.getElementById("fileInput");
        if (fi) fi.value = "";
        document.getElementById("fileName").classList.add("hidden");
        document.getElementById("fileNameText").textContent = "";
        document.getElementById("convertBtn").disabled = true;
        const wb = document.getElementById("wordBtn");
        if (wb) wb.disabled = true;
        document.getElementById("statsBadge").textContent = "fayl tanlanmagan";
        const st = document.getElementById("status");
        st.className = "";
        st.innerHTML = "";
        const textOut = document.getElementById("ocrText");
        textOut.innerHTML = "";
        textOut.style.whiteSpace = "";
        textOut.classList.add("hidden");
        tg?.HapticFeedback?.impactOccurred?.("light");
        syncOcrQuotaUi();
    }

    async function optimizeImageForOCR(file) {
        // Telegram mobil uchun: rasmni siqish/resize → tezroq upload + tezroq OCR
        // Max dimension: 1600px, JPEG quality: 0.82
        const MAX_DIM = 1600;
        const QUALITY = 0.82;
        if (!file || !file.type.startsWith("image/")) return file;
        try {
            const bmp = await createImageBitmap(file);
            // Always resize if pixel dimensions are large (even if file size is small).
            const maxSide = Math.max(bmp.width, bmp.height);
            if (maxSide <= MAX_DIM) {
                bmp.close?.();
                return file;
            }
            const scale = MAX_DIM / maxSide;
            const w = Math.max(1, Math.round(bmp.width * scale));
            const h = Math.max(1, Math.round(bmp.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d", { alpha: false });
            ctx.drawImage(bmp, 0, 0, w, h);
            bmp.close?.();
            const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", QUALITY));
            if (!blob) return file;
            // Agar kamaymasa, originalni qoldiramiz
            if (blob.size >= file.size) return file;
            return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
        } catch (_) {
            return file;
        }
    }

    function getOcrBaseCandidates() {
        const qs = new URLSearchParams(location.search);
        const normalizeBase = (u) => String(u || "").trim().replace(/\/+$/, "");
        let origin = "";
        try {
            if (location.protocol !== "file:") origin = normalizeBase(location.origin);
        } catch (_) { /* ignore */ }
        const order = [
            normalizeBase(qs.get("api")),
            origin,
            normalizeBase(window.DastyorAI?.BASE),
            "https://dastyor-ai-production.up.railway.app/webapp",
        ];
        const seen = new Set();
        const out = [];
        for (const raw of order) {
            const v = normalizeBase(raw);
            if (!v || seen.has(v)) continue;
            seen.add(v);
            out.push(v);
        }
        return out;
    }

    async function pollOcrJob(base, jobId) {
        let delay = 500;
        const maxDelay = 2500;
        const deadline = Date.now() + 120000;
        while (Date.now() < deadline) {
            let jr = null;
            try {
                const r = await fetch(base + "/api/jobs/" + jobId);
                jr = r.ok ? await r.json() : null;
            } catch (_) {}
            const st = jr?.status;
            if (st === "succeeded") return jr?.result || {};
            if (st === "failed") throw new Error(jr?.error || "OCR xatosi");
            await new Promise((r) => setTimeout(r, delay));
            delay = Math.min(maxDelay, Math.round(delay * 1.25));
        }
        throw new Error("OCR juda uzoq davom etdi. Keyinroq urinib ko'ring.");
    }

    function isGoodLayoutHtml(html) {
        const h = String(html || "").trim();
        if (h.length < 80) return false;
        const tmp = document.createElement("div");
        tmp.innerHTML = h;
        const txt = (tmp.textContent || tmp.innerText || "").replace(/\s+/g, " ").trim();
        if (txt.length < 40) return false;
        const qmarks = (txt.match(/\?/g) || []).length;
        const numbered = (txt.match(/\b\d{1,2}\.\s/g) || []).length;
        if (qmarks >= 4 && numbered <= 1) return false;
        return true;
    }

    /**
     * Avval Paddle layout (bbox + HTML), keyin Gemini (/api/ocr_extract), keyin oddiy Paddle, /api/ocr.
     */
    async function runOcrPipeline(file) {
        const baseCandidates = getOcrBaseCandidates();
        const steps = [
            { path: "/ocr?layout=1", name: "paddle_layout" },
            { path: "/api/ocr_extract", name: "gemini" },
            { path: "/ocr", name: "paddle" },
            { path: "/api/ocr", name: "api" },
        ];
        let lastDetail = "";
        for (const base of baseCandidates) {
            for (const step of steps) {
                try {
                    const fd = new FormData();
                    fd.append("file", file);
                    ocrAppendAuth(fd);
                    const r = await fetch(base + step.path, { method: "POST", body: fd });
                    if (r.status === 404) continue;
                    if (!r.ok) {
                        let err = null;
                        try { err = await r.json(); } catch (_) { /* ignore */ }
                        const detail = String(err?.detail || err?.error || "").trim();
                        if (r.status === 429) {
                            throw new Error(detail || "Limit tugadi. Premium yoki Standart tarifni oling.");
                        }
                        if (r.status === 503 && step.name === "gemini") {
                            lastDetail = detail || lastDetail;
                        } else if (detail) {
                            lastDetail = detail;
                        }
                        continue;
                    }
                    const data = await r.json();
                    let text = String(data?.text || "").trim();
                    const htmlLayout = String(data?.html_layout || "").trim();
                    const apiHtml = String(data?.html || "").trim();
                    const goodLayout = isGoodLayoutHtml(htmlLayout);
                    // Layout sifati past bo'lsa, Word uchun Gemini HTML'ni ustun qilamiz.
                    const docHtml = (goodLayout ? htmlLayout : "") || apiHtml || htmlLayout || "";
                    if (!text && data?.html) {
                        const tmp = document.createElement("div");
                        tmp.innerHTML = String(data.html);
                        text = (tmp.textContent || tmp.innerText || "").trim();
                    }
                    let usedBase = base;
                    if (!text && data?.job_id) {
                        const result = await pollOcrJob(base, String(data.job_id));
                        text = String(result?.text || "").trim();
                    }
                    if (text && htmlLayout) {
                        if (step.name === "paddle_layout" && !goodLayout) {
                            lastDetail = "Paddle layout sifati past — Gemini fallback";
                            continue;
                        }
                        return { text, html_layout: htmlLayout, docHtml, base: usedBase, engine: step.name, raw: data };
                    }
                    if (text) {
                        return { text, docHtml, base: usedBase, engine: step.name, raw: data };
                    }
                } catch (e) {
                    lastDetail = e.message || String(e);
                }
            }
        }
        throw new Error(lastDetail || "Rasmdan matn topilmadi yoki server javob bermadi");
    }

    async function convertToWord() {
        if (!selectedFile) return;
        const DA = window.DastyorAI;
        if (DA && DA.isQuotaBlockedForCategory && DA.getUser && DA.isQuotaBlockedForCategory(DA.getUser(), "ocr")) {
            showStatus("error", "AI skayner (OCR) limiti tugadi.");
            return;
        }
        showStatus("loading", "Rasm tayyorlanmoqda...");
        document.getElementById("convertBtn").disabled = true;
        const wordBtn = document.getElementById("wordBtn");
        if (wordBtn) wordBtn.disabled = true;
        try {
            try {
                if (window.DastyorAI && window.DastyorAI.showDocumentLoading) {
                    window.DastyorAI.showDocumentLoading("Rasm qayta ishlanmoqda...", "Matn ajratilmoqda, biroz kuting");
                }
            } catch (_) {}
            if (!optimizedFile) {
                showStatus("loading", "Rasm siqilmoqda...");
                optimizedFile = await optimizeImageForOCR(selectedFile);
            }
            showStatus("loading", "Matn ajratilmoqda (bot bilan bir xil tartib)...");
            const file = optimizedFile || selectedFile;
            const { text, engine, html_layout, docHtml } = await runOcrPipeline(file);
            if (!text) throw new Error("Rasmdan matn topilmadi");
            lastOcrDocxHtml = (docHtml && docHtml.length > 40) ? docHtml : "";
            const textOut = document.getElementById("ocrText");
            if (html_layout) {
                textOut.innerHTML = "<div class=\"ocr-scroll-wrap\" style=\"overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch\">" + html_layout + "</div>";
            } else {
                textOut.textContent = text;
                textOut.style.whiteSpace = "pre-wrap";
            }
            textOut.classList.remove("hidden");
            const label = html_layout
                ? "Ko'rinish saqlandi (layout OCR — bbox + HTML)"
                : (engine === "gemini" ? "Matn ajratildi (AI — botdagi kabi)" : "Matn ajratildi (zaxira OCR)");
            showStatus("success", label);
            tg?.HapticFeedback?.notificationOccurred?.("success");
            try { void window.DastyorAI?.refreshProfile?.(); } catch (_) { /* ignore */ }
        } catch (e) {
            showStatus("error", e.message || "Xatolik yuz berdi");
            tg?.HapticFeedback?.notificationOccurred?.("error");
        } finally {
            try {
                if (window.DastyorAI && window.DastyorAI.hideDocumentLoading) window.DastyorAI.hideDocumentLoading();
            } catch (_) {}
            document.getElementById("convertBtn").disabled = false;
            if (wordBtn) wordBtn.disabled = !selectedFile;
        }
    }

    async function downloadOcrWordOneToOne() {
        if (!selectedFile) return;
        const DA = window.DastyorAI;
        if (DA && DA.isQuotaBlockedForCategory && DA.getUser && DA.isQuotaBlockedForCategory(DA.getUser(), "ocr")) {
            showStatus("error", "AI skayner (OCR) limiti tugadi.");
            return;
        }
        showStatus("loading", "Word hujjat tayyorlanmoqda (1:1)...");
        const wordBtn = document.getElementById("wordBtn");
        document.getElementById("convertBtn").disabled = true;
        if (wordBtn) wordBtn.disabled = true;
        try {
            try {
                if (window.DastyorAI && window.DastyorAI.showDocumentLoading) {
                    window.DastyorAI.showDocumentLoading("Hujjat tayyorlanmoqda...", "Word fayl yaratilmoqda");
                }
            } catch (_) {}
            if (!optimizedFile) {
                optimizedFile = await optimizeImageForOCR(selectedFile);
            }
            if (!lastOcrDocxHtml || lastOcrDocxHtml.length <= 40) {
                showStatus("loading", "Ko'rinish ajratilmoqda (1:1)...");
                const file = optimizedFile || selectedFile;
                const { text, html_layout, docHtml } = await runOcrPipeline(file);
                if (!text) throw new Error("Rasmdan matn topilmadi");
                lastOcrDocxHtml = (docHtml && docHtml.length > 40) ? docHtml : "";
                const textOut = document.getElementById("ocrText");
                if (html_layout) {
                    textOut.innerHTML = "<div class=\"ocr-scroll-wrap\" style=\"overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch\">" + html_layout + "</div>";
                    textOut.classList.remove("hidden");
                }
            }
            const bases = getOcrBaseCandidates();
            let ok = false;
            for (const base of bases) {
                try {
                    const fd = new FormData();
                    const fileForWord = selectedFile || optimizedFile;
                    fd.append("file", fileForWord);
                    fd.append("strict_scan", "1");
                    fd.append("send_to_bot", "1");
                    if (lastOcrDocxHtml && lastOcrDocxHtml.length > 40) {
                        fd.append("html", lastOcrDocxHtml);
                    }
                    ocrAppendAuth(fd);
                    const r = await fetch(base + "/api/ocr_extract_docx", { method: "POST", body: fd });
                    if (r.status === 429) {
                        let d = "";
                        try {
                            const j = await r.json();
                            d = String(j.detail || "").trim();
                        } catch (_) { /* ignore */ }
                        throw new Error(d || "Limit tugadi. Premium yoki Standart tarifni oling.");
                    }
                    if (!r.ok || r.status === 404) continue;
                    const blob = await r.blob();
                    if (!blob || blob.size < 100) continue;
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "OCR_1to1.docx";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                    ok = true;
                    showStatus("success", "Word fayl yuklandi");
                    tg?.HapticFeedback?.notificationOccurred?.("success");
                    try { void window.DastyorAI?.refreshProfile?.(); } catch (_) { /* ignore */ }
                    break;
                } catch (_) {}
            }
            if (!ok) {
                throw new Error(
                    lastOcrDocxHtml
                        ? "Word yaratib bo‘lmadi. Internet yoki serverni tekshiring."
                        : "Word yaratib bo‘lmadi. Serverni tekshiring yoki qayta urinib ko‘ring."
                );
            }
        } catch (e) {
            showStatus("error", e.message || "Xatolik");
            tg?.HapticFeedback?.notificationOccurred?.("error");
        } finally {
            try {
                if (window.DastyorAI && window.DastyorAI.hideDocumentLoading) window.DastyorAI.hideDocumentLoading();
            } catch (_) {}
            document.getElementById("convertBtn").disabled = false;
            if (wordBtn) wordBtn.disabled = !selectedFile;
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        if (window.DastyorAI && window.DastyorAI.initUI) DastyorAI.initUI({ autoNavLinks: true });
        void (async function () {
            try {
                if (window.DastyorAI && window.DastyorAI.init) await window.DastyorAI.init();
                if (window.DastyorAI && window.DastyorAI.refreshProfile) await window.DastyorAI.refreshProfile();
                syncOcrQuotaUi();
            } catch (_) {}
        })();
        try {
            window.addEventListener("dastyor:profile-updated", function () { syncOcrQuotaUi(); });
        } catch (_) {}
        const drop = document.getElementById("dropZone");
        const input = document.getElementById("fileInput");
        drop.addEventListener("click", () => input.click());
        input.addEventListener("change", (e) => bindFile(e.target.files?.[0]));
        drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("ring-2", "ring-apple-blue/40", "bg-apple-blue/5"); });
        drop.addEventListener("dragleave", () => drop.classList.remove("ring-2", "ring-apple-blue/40", "bg-apple-blue/5"));
        drop.addEventListener("drop", (e) => {
            e.preventDefault();
            drop.classList.remove("ring-2", "ring-apple-blue/40", "bg-apple-blue/5");
            if (e.dataTransfer.files?.[0]) bindFile(e.dataTransfer.files[0]);
        });
        document.getElementById("convertBtn").addEventListener("click", downloadOcrWordOneToOne);
        const wb = document.getElementById("wordBtn");
        if (wb) wb.addEventListener("click", downloadOcrWordOneToOne);
        document.getElementById("backBtn").onclick = (e) => {
            e.preventDefault();
            location.href = 'more.html';
        };
        tg?.ready?.();
        tg?.expand?.();
    });
</script>
</body>
</html>
