<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tarjima | DASTYOR AI</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            blue: '#2563EB',
                            green: '#30D158',
                            orange: '#FF9F0A',
                            purple: '#BF5AF2',
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        body { background: var(--bg-color); color: var(--text-color); min-height: 100vh; }
        .scroller::-webkit-scrollbar { width: 0px; }
        .loading-shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0 }
            100% { background-position: -200% 0 }
        }
        .lang-select { -webkit-appearance: none; appearance: none; }
    </style>
</head>

<body class="antialiased selection:bg-apple-blue selection:text-white flex flex-col h-screen overflow-hidden">

    <header class="h-16 flex-shrink-0 border-b border-black/5 dark:border-white/5 bg-white/80 dark:bg-[#0a0a0c]/80 backdrop-blur-xl flex items-center px-4 z-50">
        <a href="more.html"
            class="w-10 h-10 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 transition-colors flex items-center justify-center shrink-0"
            id="backBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
            </svg>
        </a>
        <div class="ml-4 flex-1">
            <h1 class="font-display font-bold text-lg tracking-tight leading-tight flex items-center gap-2">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M5 8h10"/><path d="M10 5v3c0 4-2.5 6.5-5 8"/><path d="M16 13h4"/><path d="m16 13-3 6-3-6"/></svg>
                <span data-i18n="translate_title">Tarjima AI</span>
            </h1>
            <p class="text-[10px] font-semibold text-black/40 dark:text-white/40 uppercase tracking-widest"><span id="engineLabel">Gemini & Google</span></p>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto scroller relative flex flex-col">
        <div class="max-w-3xl w-full mx-auto p-4 md:p-6 flex flex-col h-full gap-4">

            <div id="translateQuotaWarn" class="hidden rounded-xl border border-red-200 bg-red-50 dark:bg-red-950/40 text-red-800 dark:text-red-200 text-xs font-semibold px-3 py-2 text-center" role="alert"></div>

            <div class="flex items-center gap-3 bg-white dark:bg-[#151518] border border-black/5 dark:border-white/5 rounded-2xl p-2 animate-slide-up shadow-sm">
                <div class="flex-1">
                    <div class="w-full bg-black/5 dark:bg-white/5 text-sm font-extrabold text-black/70 dark:text-white/70 rounded-xl px-4 py-3">
                        <div data-i18n="translate_src_auto" data-i18n-fallback="Manba: Avto aniqlanadi">Manba: Avto aniqlanadi</div>
                        <div class="mt-1 text-[11px] font-bold text-black/50 dark:text-white/50" id="detectedBadge">Aniqlandi: —</div>
                    </div>
                </div>
                <div class="flex-1 relative">
                    <select class="lang-select w-full bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-sm font-bold text-black dark:text-white rounded-xl px-4 py-3 outline-none transition-colors cursor-pointer" id="tgtLang">
                        <option value="en" selected data-i18n="lang_en">🇬🇧 Inglizcha</option>
                        <option value="uz" data-i18n="lang_uz">🇺🇿 O'zbekcha</option>
                        <option value="ru" data-i18n="lang_ru">🇷🇺 Ruscha</option>
                    </select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none opacity-50">▼</div>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4 flex-1 h-full min-h-[400px]">
                <div class="flex-1 flex flex-col bg-white dark:bg-[#151518] border border-black/5 dark:border-white/5 rounded-[24px] overflow-hidden shadow-sm animate-slide-up" style="animation-delay: 0.1s;">
                    <div class="flex items-center justify-between px-5 py-3 border-b border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02]">
                        <span class="text-[11px] font-bold text-apple-blue uppercase tracking-widest" id="srcLangLabel">O'zbekcha</span>
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-bold text-black/30 dark:text-white/30" id="charCount">0 / 5000</span>
                            <button onclick="clearSrc()" class="text-black/30 dark:text-white/30 hover:text-black dark:hover:text-white transition-colors">✕</button>
                        </div>
                    </div>
                    <textarea
                        class="w-full flex-1 bg-transparent border-none p-5 text-base font-medium resize-none outline-none text-black dark:text-white placeholder-black/30 dark:placeholder-white/30 leading-relaxed"
                        id="srcText" placeholder="Matnni bu yerga kiriting..." data-i18n-ph="translate_input_placeholder" oninput="onInput()"></textarea>
                </div>

                <div class="flex-1 flex flex-col bg-apple-blue/5 dark:bg-[#151518] border border-black/5 dark:border-white/5 rounded-[24px] overflow-hidden shadow-sm animate-slide-up relative" style="animation-delay: 0.15s;" id="outPanel">
                    <div class="flex items-center justify-between px-5 py-3 border-b border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02]">
                        <span class="text-[11px] font-bold text-apple-blue uppercase tracking-widest" id="tgtLangLabel">Inglizcha</span>
                        <button onclick="copyResult()" class="text-black/30 dark:text-white/30 hover:text-apple-blue transition-colors" data-i18n="translate_copy">📋 Nusxa</button>
                    </div>
                    <textarea
                        class="w-full flex-1 bg-transparent border-none p-5 text-base font-semibold resize-none outline-none text-black dark:text-white placeholder-black/30 dark:placeholder-white/30 leading-relaxed"
                        id="outText" placeholder="Tarjima shu yerda chiqadi..." data-i18n-ph="translate_output_placeholder" readonly></textarea>
                </div>
            </div>

            <div class="mt-auto pt-2 animate-slide-up flex flex-col gap-3" style="animation-delay: 0.2s;">
                <div id="statusBanner" class="hidden items-center gap-2 p-3 rounded-xl text-sm font-semibold max-w-full leading-tight">
                    <span id="statusIcon">⚠️</span>
                    <span id="statusMsg"></span>
                </div>
                <button
                    class="w-full py-4 rounded-2xl bg-apple-blue hover:bg-blue-600 active:scale-[0.98] text-white font-bold text-lg shadow-[0_8px_30px_rgba(10,132,255,0.3)] transition-all flex justify-center items-center gap-2"
                    id="trBtn" onclick="translateText()" data-i18n="translate_action">
                    ⚡ Tarjima qilish
                </button>
            </div>

            <!-- File translate (unified pipeline) -->
            <div class="animate-slide-up pb-2" style="animation-delay: 0.23s;">
                <div class="bg-white dark:bg-[#151518] border border-black/5 dark:border-white/5 rounded-2xl p-4 shadow-sm">
                    <div class="text-[10px] font-bold text-black/40 dark:text-white/40 uppercase tracking-widest mb-2" data-i18n="translate_file_title" data-i18n-fallback="Fayl tarjima (DOCX/PPTX/PDF/XLSX/TXT)">
                        Fayl tarjima (DOCX/PPTX/PDF/XLSX/TXT)
                    </div>
                    <div class="flex flex-col gap-2">
                        <input type="file" id="trFile" class="hidden" accept=".txt,.docx,.pptx,.pdf,.xlsx,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
                        <button type="button" class="w-full py-3 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-black dark:text-white font-bold transition-all"
                            onclick="document.getElementById('trFile').click()">
                            📎 Fayl tanlash
                        </button>
                        <div id="trFileName" class="text-xs font-semibold text-black/60 dark:text-white/60"></div>
                        <button type="button" id="trFileBtn"
                            class="w-full py-3 rounded-xl bg-apple-blue text-white font-bold hover:bg-blue-600 active:scale-[0.98] transition-all disabled:opacity-50 disabled:pointer-events-none"
                            onclick="translateFileAuto()">
                            ⚡ Faylni tarjima qilish
                        </button>
                        <div id="trFileStatus" class="text-xs font-semibold text-black/60 dark:text-white/60"></div>
                    </div>
                </div>
            </div>

            <div class="animate-slide-up pb-6" style="animation-delay: 0.25s;">
                <h3 class="text-[10px] font-bold text-black/40 dark:text-white/40 uppercase tracking-widest mb-3 pl-2" data-i18n="quick_phrases">Tezkor iboralar</h3>
                <div class="flex flex-wrap gap-2">
                    <button class="px-4 py-2 rounded-full border border-black/10 dark:border-white/10 bg-white/50 dark:bg-white/5 hover:bg-black/5 dark:hover:bg-white/10 text-xs font-semibold transition-colors" onclick="setPhrase(this)" data-i18n="translate_phrase_1">Salom, ahvollar qanday?</button>
                    <button class="px-4 py-2 rounded-full border border-black/10 dark:border-white/10 bg-white/50 dark:bg-white/5 hover:bg-black/5 dark:hover:bg-white/10 text-xs font-semibold transition-colors" onclick="setPhrase(this)" data-i18n="translate_phrase_2">Katta Rahmat!</button>
                    <button class="px-4 py-2 rounded-full border border-black/10 dark:border-white/10 bg-white/50 dark:bg-white/5 hover:bg-black/5 dark:hover:bg-white/10 text-xs font-semibold transition-colors" onclick="setPhrase(this)" data-i18n="translate_phrase_3">Iltimos, menga xabar bering</button>
                    <button class="px-4 py-2 rounded-full border border-black/10 dark:border-white/10 bg-white/50 dark:bg-white/5 hover:bg-black/5 dark:hover:bg-white/10 text-xs font-semibold transition-colors" onclick="setPhrase(this)" data-i18n="translate_phrase_4">Uchrashuvni bekor qila olasizmi?</button>
                </div>
            </div>

        </div>
    </main>

    <script>
        // ── DOM refs cached once ──────────────────────────────────────────────
        const $ = id => document.getElementById(id);
        const DOM = {
            srcText:     null,
            outText:     null,
            charCount:   null,
            engineLabel: null,
            statusBanner:null,
            statusIcon:  null,
            statusMsg:   null,
            trBtn:       null,
            tgtLangEl:   null,
            tgtLangLabel:null,
        };
        function cacheDOM() {
            DOM.srcText      = $('srcText');
            DOM.outText      = $('outText');
            DOM.charCount    = $('charCount');
            DOM.engineLabel  = $('engineLabel');
            DOM.statusBanner = $('statusBanner');
            DOM.statusIcon   = $('statusIcon');
            DOM.statusMsg    = $('statusMsg');
            DOM.trBtn        = $('trBtn');
            DOM.tgtLangEl    = $('tgtLang');
            DOM.tgtLangLabel = $('tgtLangLabel');
        }

        // ── Init ─────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async function () {
            cacheDOM();
            try {
                if (window.DastyorAI?.initUI) await window.DastyorAI.initUI({ autoNavLinks: true });
                if (window.DastyorAI?.refreshProfile) await window.DastyorAI.refreshProfile();
                _applyQuota();
            } catch (_) {}
            try { _restoreDraftIfAny(); } catch (_) {}
            if (tg) { tg.ready(); tg.expand(); }
        });

        try {
            window.addEventListener('dastyor:profile-updated', _applyQuota);
        } catch (_) {}

        function _applyQuota() {
            if (window.DastyorAI?.applyServiceQuotaUi) {
                window.DastyorAI.applyServiceQuotaUi('translate', {
                    warnId: 'translateQuotaWarn',
                    buttonIds: ['trBtn'],
                    message: '⛔ Bu xizmat pullik. Davom etish uchun Premium/Pro tarifni oling.',
                });
            }
        }

        // ── Globals ───────────────────────────────────────────────────────────
        const tg  = window.Telegram?.WebApp;
        const SDK = window.DastyorAI;
        const Core = window.DA;

        const tid = (SDK?.getTelegramId && SDK.getTelegramId())
            || new URLSearchParams(location.search).get('telegram_id')
            || sessionStorage.getItem('tg_id')
            || tg?.initDataUnsafe?.user?.id?.toString()
            || '';

        $('backBtn').onclick = e => {
            e.preventDefault();
            location.href = 'more.html' + (tid ? '?telegram_id=' + tid : '');
        };

        const LANG_NAMES = { uz: "O'zbekcha", en: "Inglizcha", ru: "Ruscha" };
        let tgtLang = 'en';

        // File translate
        const trFileEl = document.getElementById('trFile');
        const trFileNameEl = document.getElementById('trFileName');
        const trFileStatusEl = document.getElementById('trFileStatus');
        const trFileBtnEl = document.getElementById('trFileBtn');
        let _pickedFile = null;

        trFileEl?.addEventListener('change', () => {
            const f = trFileEl.files && trFileEl.files[0];
            _pickedFile = f || null;
            if (trFileNameEl) trFileNameEl.textContent = f ? `Tanlandi: ${f.name} (${Math.round(f.size / 1024)} KB)` : '';
            if (trFileStatusEl) trFileStatusEl.textContent = '';
        });

        // ── Lang helpers ─────────────────────────────────────────────────────
        function updateLangLabels() {
            DOM.tgtLangLabel.textContent = LANG_NAMES[tgtLang];
            DOM.tgtLangEl.value = tgtLang;
        }

        DOM.tgtLangEl?.addEventListener('change', function () {
            tgtLang = this.value;
            updateLangLabels();
        });

        // ── State ────────────────────────────────────────────────────────────
        let _autoTrTimer    = null;
        let _activeTrAbort  = null;
        let _trSeq          = 0;
        let _lastAutoSig    = '';   // combined: normalizedText + '|' + dir
        let _lastStableOut  = '';
        let _draftTimer     = null;

        const _TR_DRAFT_KEY = 'dastyor_translate_draft_v1';

        // ── Draft: single-level timer, no idle callback nesting ───────────────
        function _saveDraftSoon() {
            clearTimeout(_draftTimer);
            _draftTimer = setTimeout(() => {
                try {
                    localStorage.setItem(_TR_DRAFT_KEY, JSON.stringify({
                        v: 1, ts: Date.now(),
                        srcLang, tgtLang,
                        src: DOM.srcText?.value || '',
                        out: DOM.outText?.value || '',
                    }));
                } catch (_) {}
            }, 700);
        }

        function _restoreDraftIfAny() {
            try {
                const raw = localStorage.getItem(_TR_DRAFT_KEY);
                if (!raw) return;
                const d = JSON.parse(raw);
                if (!d || d.v !== 1) return;
                if (d.srcLang) srcLang = d.srcLang;
                if (d.tgtLang) tgtLang = d.tgtLang;
                updateLangLabels();
                if (typeof d.src === 'string') DOM.srcText.value = d.src;
                if (typeof d.out === 'string') DOM.outText.value = d.out;
                onInput();
            } catch (_) {}
        }

        // ── normalizeCompare: called once per debounce, not per keystroke ─────
        function normalizeCompare(s) {
            return String(s || '').trim().toLowerCase()
                .replace(/['`ʻʼʹ]/g, "'")
                .replace(/\s+/g, ' ');
        }

        function isMeaningfullyChanged(source, candidate) {
            return normalizeCompare(source) !== normalizeCompare(candidate);
        }

        // ── onInput: minimal work per keystroke ──────────────────────────────
        const CC_NORMAL  = "text-[10px] font-bold text-black/30 dark:text-white/30";
        const CC_WARN    = "text-[10px] font-bold text-apple-orange";
        const CC_ERROR   = "text-[10px] font-bold text-red-500";

        function onInput() {
            // abort in-flight request immediately
            if (_activeTrAbort) {
                try { _activeTrAbort.abort(); } catch (_) {}
                _activeTrAbort = null;
                DOM.outText.classList.remove('loading-shimmer');
                setEngine(t('translate_typing_engine', 'Yozilyapti...'));
            }

            const len = DOM.srcText.value.length;
            DOM.charCount.textContent = len + ' / 5000';
            // only update className when it actually needs to change (avoids layout thrashing)
            const newCC = len >= 5000 ? CC_ERROR : len > 4500 ? CC_WARN : CC_NORMAL;
            if (DOM.charCount.className !== newCC) DOM.charCount.className = newCC;

            scheduleAutoTranslate();
            _saveDraftSoon();
        }

        // ── Auto-translate debounce ───────────────────────────────────────────
        function scheduleAutoTranslate() {
            const raw = DOM.srcText.value;
            if (!raw || raw.length > 5000) return;
            clearTimeout(_autoTrTimer);
            _autoTrTimer = setTimeout(() => {
                const trimmed = raw.trim();
                if (!trimmed) return;
                const sig = normalizeCompare(trimmed) + '|' + srcLang + '_' + tgtLang;
                if (sig === _lastAutoSig) return;
                _lastAutoSig = sig;
                translateText({ auto: true });
            }, 450);
        }

        // ── Phrase chip ───────────────────────────────────────────────────────
        function setPhrase(el) {
            DOM.srcText.value = el.textContent;
            onInput();
            tg?.HapticFeedback?.selectionChanged();
        }

        function clearSrc() {
            DOM.srcText.value = '';
            DOM.outText.value = '';
            _lastAutoSig = '';
            _lastStableOut = '';
            onInput();
            hideStatus();
            _saveDraftSoon();
        }

        // ── Status helpers ────────────────────────────────────────────────────
        function showStatus(type, icon, msg) {
            const b = DOM.statusBanner;
            b.className = 'flex items-center gap-2 p-3 rounded-xl text-sm font-semibold max-w-full leading-tight border ';
            if (type === 'error')   b.className += 'bg-red-500/10 text-red-500 border-red-500/20';
            else if (type === 'success') b.className += 'bg-apple-green/10 text-apple-green border-apple-green/20';
            else                    b.className += 'bg-apple-blue/10 text-apple-blue border-apple-blue/20';
            DOM.statusIcon.textContent = icon;
            DOM.statusMsg.textContent  = msg;
        }

        function hideStatus() {
            DOM.statusBanner.className = 'hidden items-center gap-2 p-3 rounded-xl text-sm font-semibold max-w-full leading-tight';
        }

        function setEngine(name) {
            DOM.engineLabel.textContent = name;
        }

        // ── i18n helper ───────────────────────────────────────────────────────
        function t(key, fallback) {
            try {
                const v = (SDK?.t && SDK.t(key)) || (Core?.t && Core.t(key)) || '';
                if (v && v !== key) return v;
            } catch (_) {}
            return fallback || key;
        }

        function copyResult() {
            const txt = DOM.outText.value;
            if (!txt) return;
            navigator.clipboard?.writeText(txt)
                .catch(() => { DOM.outText.select(); document.execCommand('copy'); });
            tg?.HapticFeedback?.notificationOccurred('success');
        }

        // ── Auth payload ──────────────────────────────────────────────────────
        function webAuthQuotaPayload() {
            const tid2 = SDK?.getTelegramId?.()
                || new URLSearchParams(location.search).get('telegram_id')
                || sessionStorage.getItem('tg_id');
            const tok = SDK?.getToken?.() || sessionStorage.getItem('tg_token');
            return (tid2 && /^\d+$/.test(String(tid2)))
                ? { telegram_id: parseInt(tid2, 10), token: tok || null }
                : {};
        }

        // ── Fetch helpers ─────────────────────────────────────────────────────
        function makeSignal(outerSignal, ms) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            const merged = (outerSignal && AbortSignal.any)
                ? AbortSignal.any([outerSignal, ctrl.signal])
                : ctrl.signal;
            return { signal: merged, clear: () => clearTimeout(timer) };
        }

        async function callTranslateAuto(text, tgt, outerSignal) {
            if (location.protocol === 'file:') return null;
            const { signal, clear } = makeSignal(outerSignal, 12000);
            try {
                const res = await fetch(location.origin + '/api/translate_auto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, target_lang: tgt, ...webAuthQuotaPayload() }),
                    signal,
                });
                clear();
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    const detail = (data && (data.detail || data.error)) ? String(data.detail || data.error) : '';
                    if (res.status === 429 || /limit|quota|premium|tarif|pullik/i.test(detail))
                        throw new Error('__LIMIT__:' + (detail || 'Tarjima limiti tugadi'));
                    throw new Error(detail ? `${detail} (HTTP ${res.status})` : `HTTP ${res.status}`);
                }
                return data?.translated_text
                    ? {
                        text: data.translated_text,
                        engine: 'Auto (Gemini/Google)',
                        source_lang: data.source_lang || null,
                        target_lang: data.target_lang || tgt,
                        direction: data.direction || null,
                      }
                    : null;
            } catch (e) {
                clear();
                throw e;
            }
        }

        // ── Main translate ────────────────────────────────────────────────────
        async function translateText(opts) {
            const isAuto = !!(opts?.auto);

            if (SDK?.isQuotaBlockedForCategory && SDK?.getUser &&
                SDK.isQuotaBlockedForCategory(SDK.getUser(), 'translate')) {
                showStatus('error', '⛔', t('translate_quota', 'Bu xizmat pullik. Premium/Pro tarifni oling.'));
                return;
            }

            const srcTxt = DOM.srcText.value.trim();
            if (!srcTxt) {
                if (_activeTrAbort) { try { _activeTrAbort.abort(); } catch (_) {} _activeTrAbort = null; }
                DOM.outText.classList.remove('loading-shimmer');
                setEngine(t('translate_idle_engine', 'Tayyor'));
                if (!isAuto) showStatus('error', '⚠️', t('translate_enter_text', 'Matn kiriting!'));
                return;
            }
            if (srcTxt.length > 5000) { showStatus('error', '⚠️', t('translate_max_chars', 'Max 5000 belgi.')); return; }
            // cancel previous
            if (_activeTrAbort) { try { _activeTrAbort.abort(); } catch (_) {} }
            _activeTrAbort = new AbortController();
            const mySeq    = ++_trSeq;
            const mySignal = _activeTrAbort.signal;

            if (!isAuto) {
                DOM.trBtn.textContent = t('translate_wait', 'Kuting...');
                DOM.trBtn.disabled = true;
                DOM.trBtn.classList.add('opacity-70');
            }
            if (DOM.outText.value.trim()) _lastStableOut = DOM.outText.value;
            DOM.outText.classList.add('loading-shimmer');
            hideStatus();
            setEngine(t('translate_loading_engine', 'Yuklanmoqda...'));

            const resetBtn = () => {
                if (!isAuto) {
                    DOM.trBtn.innerHTML = t('translate_action', '⚡ Tarjima Qilish');
                    DOM.trBtn.disabled  = false;
                    DOM.trBtn.classList.remove('opacity-70');
                }
            };

            const stale = () => mySeq !== _trSeq || mySignal.aborted;

            const applyResult = (result, statusType) => {
                if (stale()) return false;
                if (!isMeaningfullyChanged(srcTxt, result.text))
                    throw new Error('Tarjima natijasi original bilan bir xil chiqdi');
                DOM.outText.value = result.text;
                _lastStableOut = result.text;
                DOM.outText.classList.remove('loading-shimmer');
                setEngine(result.engine);
                // Show detected language + direction
                try {
                    const map = { uz: "O'zbekcha", en: "Inglizcha", ru: "Ruscha" };
                    const s = (result.source_lang || '').toLowerCase();
                    const t2 = (result.target_lang || tgtLang || '').toLowerCase();
                    const srcLabel = map[s] || (s ? s.toUpperCase() : "Avto");
                    const tgtLabel = map[t2] || (t2 ? t2.toUpperCase() : (LANG_NAMES[tgtLang] || ''));
                    const badge = document.getElementById('detectedBadge');
                    if (badge) badge.textContent = `Aniqlandi: ${srcLabel} → ${tgtLabel}`;
                    if (DOM.srcLangLabel) DOM.srcLangLabel.textContent = srcLabel;
                } catch (_) {}
                showStatus(statusType, statusType === 'success' ? '✅' : '🌐',
                    t('translate_done', 'Tarjima qilindi'));
                tg?.HapticFeedback?.notificationOccurred('success');
                _saveDraftSoon();
                resetBtn();
                return true;
            };

            let lastError = null;

            try {
                const r = await callTranslateAuto(srcTxt, tgtLang, mySignal);
                if (r) { applyResult(r, 'success'); void SDK?.refreshProfile?.(); return; }
            } catch (e) {
                if (e?.name === 'AbortError' || String(e?.message).toLowerCase().includes('aborted')) return;
                lastError = e?.message || String(e);
                if (lastError.startsWith('__LIMIT__:')) {
                    if (stale()) return;
                    const msg = lastError.replace('__LIMIT__:', '').trim() || 'Bu xizmat pullik.';
                    DOM.outText.classList.remove('loading-shimmer');
                    setEngine('Limit');
                    showStatus('error', '⛔', /premium|pro|tarif|pullik/i.test(msg)
                        ? msg : msg + ' Premium/Pro tarifni oling.');
                    resetBtn();
                    return;
                }
            }

            if (stale()) return;
            DOM.outText.value = _lastStableOut || DOM.outText.value || '';
            DOM.outText.classList.remove('loading-shimmer');
            setEngine('Xato');
            showStatus('error', '❌', 'Xatolik: ' + lastError);
            tg?.HapticFeedback?.notificationOccurred('error');
            resetBtn();
            _saveDraftSoon();
        }

        async function translateFileAuto() {
            const f = _pickedFile;
            if (!f) {
                if (trFileStatusEl) trFileStatusEl.textContent = "Avval fayl tanlang.";
                return;
            }
            if (trFileBtnEl) trFileBtnEl.disabled = true;
            if (trFileStatusEl) trFileStatusEl.textContent = "⏳ Fayl yuklanmoqda...";
            try {
                const fd = new FormData();
                fd.append('file', f, f.name);
                fd.append('action', 'translate_auto');
                fd.append('target_lang', tgtLang);
                const q = webAuthQuotaPayload();
                if (q.telegram_id) fd.append('telegram_id', String(q.telegram_id));
                if (q.token) fd.append('token', String(q.token));

                const r = await fetch(location.origin + '/api/process_file', { method: 'POST', body: fd });
                const data = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
                const out = String(data.text || '').trim();
                if (!out) throw new Error("Tarjima bo'sh qaytdi");

                // download as txt (keeps fast + simple)
                const blob = new Blob([out], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = (f.name.replace(/\.[^.]+$/, '') || 'document') + `_translated_${tgtLang}.txt`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { try { URL.revokeObjectURL(url); } catch (_) {} a.remove(); }, 1500);
                if (trFileStatusEl) trFileStatusEl.textContent = "✅ Tarjima tayyor (TXT yuklandi).";
                try { void window.DastyorAI?.refreshProfile?.(); } catch (_) {}
            } catch (e) {
                if (trFileStatusEl) trFileStatusEl.textContent = "❌ Xatolik: " + (e?.message || String(e));
            } finally {
                if (trFileBtnEl) trFileBtnEl.disabled = false;
            }
        }

        // ── Ctrl+Enter shortcut ───────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            $('srcText')?.addEventListener('keydown', e => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    translateText();
                }
            });
        });

        // init lang labels immediately (before DOMContentLoaded fires for select listeners)
        document.addEventListener('DOMContentLoaded', () => {
            updateLangLabels();
        });
    </script>
</body>
</html>
